name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # surefire roda os testes unitários (Mockito); failsafe roda os *IT com Testcontainers (PostgreSQL real)
      - name: Testes unitários e de integração
        run: ./mvnw -B verify
      - name: Imagem Docker
        run: docker build -t fintrack-api:${{ github.sha }} .
