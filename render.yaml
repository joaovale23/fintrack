# Blueprint do Render: a API do fintrack no plano gratuito, com banco no Neon.
# Valores com "sync: false" são segredos: o Render pede para preenchê-los no painel ao criar o serviço.
services:
  - type: web
    name: fintrack-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: CORS_ALLOWED_ORIGINS
        value: https://joaovale23.github.io
      # O Render gera um segredo aleatório para assinar os tokens.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Painel /admin e avisos por e-mail de relatos e erros novos (Brevo, porta 2525).
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPPORT_PANEL_URL
        value: https://joaovale23.github.io/fintrack/admin
