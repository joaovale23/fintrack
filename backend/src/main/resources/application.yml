spring:
  application:
    name: fintrack
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}

fintrack:
  jwt:
    # Em produção vem da variável JWT_SECRET. O valor abaixo serve só para rodar localmente.
    secret: ${JWT_SECRET:segredo-local-de-desenvolvimento-com-32-bytes-ou-mais}
    expiration: 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    ttl: 24h
  admin:
    # Contas que veem o painel /admin (separadas por vírgula). Em produção, variável ADMIN_EMAILS.
    emails: ${ADMIN_EMAILS:}
  support:
    # Remetente dos avisos por e-mail (precisa estar validado na Brevo). Vazio desliga os avisos.
    from: ${SUPPORT_FROM:}
    panel-url: ${SUPPORT_PANEL_URL:http://localhost:4200/admin}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      file: compose.yaml

---
# Produção (Render + Neon). Os segredos chegam por variáveis de ambiente.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  # Avisos de relatos e erros novos pela Brevo, a mesma conta do hexfolio.
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    # O plano gratuito do Render bloqueia a saída pelas portas 25, 465 e 587. A Brevo também atende na 2525.
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
