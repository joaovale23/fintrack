spring:
  application:
    name: fintrack
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}

fintrack:
  jwt:
    # Em produção vem da variável JWT_SECRET. O valor abaixo serve só para rodar localmente.
    secret: ${JWT_SECRET:segredo-local-de-desenvolvimento-com-32-bytes-ou-mais}
    expiration: 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    ttl: 24h

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      file: compose.yaml

---
# Produção (Render + Neon). Os segredos chegam por variáveis de ambiente.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
